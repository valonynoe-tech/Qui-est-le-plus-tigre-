<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Qui est le plus tigre ?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plus tigre">
<meta name="theme-color" content="#FF7A1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Luckiest+Guy&display=swap">
<style>
/* Layout : app plein écran, un écran visible à la fois ; plateau = 4 lignes qui défilent à l'horizontale */
:root{
  --bg:#FF7A1A; --bg-stripe:rgba(214,84,0,.38); --ink:#2B1408; --paper:#FFF6E8;
  --sun:#FFD23F; --grape:#7B2FF7; --mint:#19C2A8; --pink:#FF4F9A; --red:#E8323C; --veil:rgba(43,20,8,.62);
  --display:"Luckiest Guy","Arial Black",Impact,system-ui,sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{
  background-color:var(--bg);
  background-image:repeating-linear-gradient(118deg,transparent 0 54px,var(--bg-stripe) 54px 66px,transparent 66px 92px,var(--bg-stripe) 92px 98px);
  color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;padding-block:12px 14px;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--paper);outline-offset:3px}

/* Boutons cartoon */
.btn{font-family:var(--display);font-size:1.2rem;letter-spacing:.03em;line-height:1.1;color:var(--ink);
  background:var(--sun);border:3px solid var(--ink);border-radius:18px;padding:13px 18px 10px;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.paper{background:var(--paper)} .btn.mint{background:var(--mint)} .btn.pink{background:var(--pink)}
.btn.grape{background:var(--grape);color:var(--paper)} .btn.red{background:var(--red);color:var(--paper)}
.btn.small{font-size:.95rem;padding:9px 12px 7px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.icon-btn{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.icon-btn svg{width:22px;height:22px}

.bar{display:flex;align-items:center;gap:10px}
.title{font-family:var(--display);font-size:1.7rem;letter-spacing:.02em;color:var(--paper);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-wrap:balance;line-height:1.05;flex:1;min-width:0}
.av svg{width:100%;height:100%;display:block}

/* Accueil */
#home{justify-content:space-between}
.logo{text-align:center;padding-top:clamp(8px,4vh,40px)}
.logo .sticker{width:96px;height:96px;margin:0 auto 6px;border-radius:50%;background:var(--sun);border:4px solid var(--ink);
  box-shadow:0 6px 0 var(--ink);display:grid;place-items:center;font-size:56px;transform:rotate(-8deg)}
.logo .l1{font-family:var(--display);font-size:clamp(1.6rem,8vw,2.3rem);color:var(--paper);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;transform:rotate(-3deg)}
.logo .l2{font-family:var(--display);font-size:clamp(3.6rem,20vw,6rem);line-height:.95;color:var(--sun);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);transform:rotate(-3deg)}
.games{display:flex;flex-direction:column;gap:12px}
.game-card{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--ink)}
.game-card:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.game-card .gi{width:58px;height:58px;flex:0 0 58px;border-radius:16px;border:3px solid var(--ink);display:grid;place-items:center;font-size:32px;background:var(--mint)}
.game-card b{font-family:var(--display);font-size:1.15rem;letter-spacing:.02em;font-weight:400;display:block;line-height:1.1}
.game-card small{font-size:.9rem;line-height:1.25;display:block;margin-top:3px}
.game-card:disabled{opacity:.6;cursor:default;box-shadow:0 3px 0 var(--ink)}
.game-card:disabled .gi{background:#E9DCC8}
.resume{background:var(--grape);color:var(--paper)}
.resume .gi{background:var(--sun)}
.home-foot{display:flex;justify-content:center;gap:10px}

/* Joueurs */
.hint{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:.95rem;line-height:1.3}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.tile-wrap{position:relative}
.tile{width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:8px 6px 6px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
.tile .av{width:76px;height:78px}
.tile .nm{font-weight:800;font-size:.95rem;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.on{background:var(--sun);transform:translateY(-2px)}
.tile .badge{position:absolute;top:-8px;left:-6px;width:30px;height:30px;border-radius:50%;background:var(--grape);color:var(--paper);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:1rem}
.tile-edit{position:absolute;top:-8px;right:-6px;width:32px;height:32px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center}
.tile-edit svg{width:15px;height:15px}
.empty{text-align:center;background:var(--paper);border:3px dashed var(--ink);border-radius:20px;padding:22px 16px;line-height:1.35}
.empty b{font-family:var(--display);font-weight:400;font-size:1.2rem;display:block;margin-bottom:4px}
.foot{display:flex;gap:10px}
.foot .btn{flex:1}

/* Éditeur */
.preview{display:flex;align-items:center;gap:14px}
.preview .av{width:120px;height:124px;flex:0 0 120px;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);padding:4px}
.preview .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.preview label{font-family:var(--display);font-size:.95rem;letter-spacing:.03em}
.preview input{width:100%;font:inherit;font-weight:800;font-size:1.15rem;padding:10px 12px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);-webkit-user-select:text;user-select:text}
.preview .tap{font-size:.8rem;line-height:1.2}
.group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.group h3{margin:0;font-family:var(--display);font-weight:400;font-size:1rem;letter-spacing:.04em;color:var(--paper);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 4px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 0 var(--ink);min-width:66px}
.chip .av{width:56px;height:56px}
.chip span{font-size:.72rem;font-weight:800;line-height:1.1;white-space:nowrap;padding:0 4px}
.chip.on{background:var(--sun);box-shadow:0 3px 0 var(--ink),0 0 0 3px var(--paper)}
.sw{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.sw.on{box-shadow:0 3px 0 var(--ink),0 0 0 4px var(--paper),0 0 0 7px var(--ink)}

/* Partie */
.g-head{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:6px 8px 6px 6px;box-shadow:0 5px 0 var(--ink)}
.g-head .av{width:64px;height:66px;flex:0 0 64px;background:var(--sun);border:3px solid var(--ink);border-radius:16px}
.g-head .who{flex:1;min-width:0}
.g-head .who small{font-size:.78rem;display:block;line-height:1}
.g-head .who b{font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.02em;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:5px;margin-top:3px}
.pip{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:#EADCC6}
.pip.on{background:var(--mint)}
.board{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:15px;padding:12px 0 4px}
.row{position:relative;display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;gap:6px;
  background:rgba(255,246,232,.28);border:3px solid var(--ink);border-radius:20px;padding:6px}
.zone{height:84px;border:3px dashed var(--ink);border-radius:14px;background:rgba(255,246,232,.35);display:grid;place-items:center;padding:0}
.zone svg{width:20px;height:20px}
.zone.on{background:var(--sun);border-style:solid;box-shadow:0 0 0 3px var(--paper)}
.track{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-width:0}
.track::-webkit-scrollbar{display:none}
.track-in{display:flex;gap:6px;width:max-content;margin:0 auto;padding:5px 3px 6px}
.count{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sun);font-family:var(--display);font-size:.8rem;letter-spacing:.04em;padding:3px 9px 1px;border-radius:10px;white-space:nowrap}
.card{position:relative;flex:0 0 62px;width:62px;height:80px;background:radial-gradient(circle,rgba(43,20,8,.2) 1.1px,transparent 1.5px) 0 0/5px 5px,var(--c);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 2px 5px;overflow:visible}
.card::before{content:"";position:absolute;top:3px;left:50%;width:58px;height:56px;transform:translateX(-50%);background:#fff;
  clip-path:polygon(50% 0,60% 20%,82% 8%,78% 32%,100% 40%,82% 56%,96% 80%,70% 74%,60% 100%,48% 80%,26% 96%,26% 70%,0 62%,18% 46%,4% 20%,30% 26%)}
.card .em{font-size:31px;line-height:1;margin-bottom:3px;position:relative}
.card .em.polo{width:44px;height:44px;margin-bottom:2px}
.card .em.art{width:48px;height:48px;margin-bottom:1px}.card .em.art svg{width:100%;height:100%;display:block}
.duel{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.1rem}
.duel .card{animation:none}
.pop .card .em.polo.av{width:44px;height:44px}
.card .nm{font-size:8.5px;font-weight:800;line-height:1.05;text-align:center;letter-spacing:.02em;position:relative;background:var(--ink);color:var(--sun);padding:2px 4px 1px;transform:rotate(-4deg);max-width:58px;text-transform:uppercase}
.card.new{animation:dropIn .45s cubic-bezier(.2,1.5,.4,1) both}
.card.punch-r{animation:punchR .65s ease both;z-index:2}
.card.punch-l{animation:punchL .65s ease both;z-index:2}
.card.hit-r{animation:hitR .65s ease both}
.card.hit-l{animation:hitL .65s ease both}
.row.collapse .card{animation:collapse .45s ease-in forwards}
.boom{position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-10deg);background:var(--sun);color:var(--red);font-family:var(--display);font-size:.9rem;
  padding:10px 9px 8px;clip-path:polygon(50% 0,61% 22%,85% 8%,78% 34%,100% 42%,80% 58%,94% 82%,68% 74%,58% 100%,46% 78%,22% 94%,26% 68%,0 60%,20% 44%,6% 18%,34% 26%);
  animation:boom .6s ease both;pointer-events:none;z-index:3;white-space:nowrap}
@keyframes dropIn{from{transform:translateY(-90px) rotate(-14deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes punchR{0%{transform:none}35%{transform:translateX(-8px) scale(1.15) rotate(-6deg)}55%{transform:translateX(22px) scale(1.25)}100%{transform:none}}
@keyframes punchL{0%{transform:none}35%{transform:translateX(8px) scale(1.15) rotate(6deg)}55%{transform:translateX(-22px) scale(1.25)}100%{transform:none}}
@keyframes hitR{0%,50%{transform:none}62%{transform:translateX(12px) rotate(14deg)}74%{transform:translateX(-4px) rotate(-6deg)}86%{transform:translateX(4px) rotate(3deg)}100%{transform:none}}
@keyframes hitL{0%,50%{transform:none}62%{transform:translateX(-12px) rotate(-14deg)}74%{transform:translateX(4px) rotate(6deg)}86%{transform:translateX(-4px) rotate(-3deg)}100%{transform:none}}
@keyframes boom{0%,45%{opacity:0;transform:translateX(-50%) scale(.2)}60%{opacity:1;transform:translateX(-50%) scale(1.25) rotate(-10deg)}100%{opacity:0;transform:translateX(-50%) scale(1) rotate(-10deg)}}
@keyframes collapse{to{transform:translateY(50px) rotate(25deg);opacity:0}}
.actions{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:10px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:9px}
.actions p{margin:0;text-align:center;font-weight:700;line-height:1.25;min-height:2.5em;display:flex;align-items:center;justify-content:center}
.actions p b{font-weight:800}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice .btn{display:flex;align-items:center;justify-content:center;gap:6px;font-size:1.1rem;padding:14px 8px 11px}
.choice svg{width:18px;height:18px;flex:0 0 18px}

/* Calques : résultats, POTEAU, menu */
.overlay{position:fixed;inset:0;z-index:20;background:var(--veil);display:grid;place-items:center;
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.pop{width:min(100%,380px);background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.pop .av{width:120px;height:124px}
.pop .big{font-family:var(--display);font-size:2.6rem;line-height:1;letter-spacing:.02em;color:var(--sun);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
.pop .big.red{color:var(--red)} .pop .big.mint{color:var(--mint)}
.pop .msg{font-size:1.15rem;font-weight:700;line-height:1.3}
.pop .num{font-family:var(--display);font-size:4.2rem;line-height:.9;color:var(--pink);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
.pop .btn{align-self:stretch;margin-top:6px}
@keyframes pop{from{transform:scale(.5) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.overlay.toast{background:transparent;pointer-events:none}
.overlay.toast .pop{width:auto;flex-direction:row;padding:10px 18px 10px 10px;gap:10px}
.overlay.toast .pop .av{width:64px;height:66px}
.overlay.poteau{background:var(--red);animation:flash .18s steps(2) 6}
.overlay.poteau .pop{background:transparent;border:0;box-shadow:none}
.poteau-word{font-family:var(--display);font-size:clamp(2.6rem,15vw,4.6rem);line-height:.95;color:var(--sun);-webkit-text-stroke:10px var(--ink);paint-order:stroke fill;
  text-shadow:0 8px 0 var(--ink);animation:shake .12s linear infinite;word-break:break-all}
.poteau .msg{color:var(--paper);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;font-family:var(--display);font-size:2rem;letter-spacing:.03em}
.poteau .av{background:var(--paper);border:4px solid var(--ink);border-radius:24px}
@keyframes flash{50%{background:var(--sun)}}
@keyframes shake{0%{transform:translate(0,0) rotate(-3deg)}25%{transform:translate(3px,-2px) rotate(2deg)}50%{transform:translate(-2px,3px) rotate(-2deg)}75%{transform:translate(2px,2px) rotate(3deg)}100%{transform:translate(0,0) rotate(-3deg)}}

.sheet-bg{position:fixed;inset:0;z-index:15;background:var(--veil);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86%;overflow-y:auto;background:var(--paper);border:4px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.4rem;letter-spacing:.02em}
.sheet h3{margin:4px 0 0;font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.03em}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;background:#F3E4CC;font-weight:800}
.toggle i{width:42px;height:24px;border-radius:12px;border:3px solid var(--ink);background:#D8C6AB;position:relative;flex:0 0 42px}
.toggle i::after{content:"";position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:left .15s}
.toggle.on i{background:var(--mint)} .toggle.on i::after{left:19px}
.plist{display:flex;flex-direction:column;gap:8px}
.pl{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:14px;padding:5px 8px 5px 5px;background:#F3E4CC}
.pl .av{width:44px;height:46px}
.pl b{font-weight:800;display:block;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{font-size:.8rem;font-variant-numeric:tabular-nums}
.pl.out{opacity:.6}
.pl.cur{background:var(--sun)}
.sheet .stack{display:flex;flex-direction:column;gap:10px}

/* Classement */
.ranks{display:flex;flex-direction:column;gap:10px}
.rk{display:grid;grid-template-columns:34px 54px minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:6px 12px 6px 8px;box-shadow:0 4px 0 var(--ink)}
.rk .pos{font-family:var(--display);font-size:1.5rem;text-align:center}
.rk .av{width:54px;height:56px;position:relative}
.rk b{font-weight:800;font-size:1.05rem;display:block;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk small{font-size:.82rem;font-variant-numeric:tabular-nums;line-height:1.2;display:block}
.rk .tot{font-family:var(--display);font-size:1.6rem;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.rk .tot span{display:block;font-family:var(--body);font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.rk.first{background:var(--sun);transform:scale(1.02)}
.rk .crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:22px}
.rk.out{background:#E7D7BE}
.tomb{font-size:1rem}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-height:700px){.zone{height:76px}.card{height:74px}.card .em{font-size:27px}.g-head .av{width:54px;height:56px;flex-basis:54px}}
</style>

<style>body{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<div id="app">
  <!-- ACCUEIL -->
  <section id="home" class="screen">
    <div class="logo">
      <div class="sticker" aria-hidden="true">🐯</div>
      <div class="l1">Qui est le plus</div>
      <div class="l2">tigre&nbsp;?</div>
    </div>
    <div class="games">
      <button class="game-card resume" id="btnResume" hidden>
        <span class="gi" aria-hidden="true">⏯️</span>
        <span><b>Reprendre la partie</b><small id="resumeInfo"></small></span>
      </button>
      <button class="game-card" id="btnCreve">
        <span class="gi" aria-hidden="true">🥊</span>

const mf=m=>440*Math.pow(2,(m-69)/12);
const BASS=[48,0,60,0,48,0,60,0,43,0,55,0,43,0,55,0,45,0,57,0,45,0,57,0,41,0,53,0,41,0,53,0];

const Snd={ctx:null,master:null,mus:null,timer:null,step:0,next:0,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return true}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{this.ctx=new AC()}catch(e){return false}

    this.mus=this.ctx.createGain();this.mus.gain.value=.3;this.mus.connect(this.master);return true},
  tone(f,t,d,o={}){const c=this.ctx,os=c.createOscillator(),g=c.createGain();os.type=o.type||'square';
    os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.1,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    os.connect(g);g.connect(o.dest||this.master);os.start(t);os.stop(t+d+.05)},
  noise(t,d,vol=.3,freq=1200,type='lowpass',dest){const c=this.ctx,len=Math.max(1,Math.floor(c.sampleRate*d)),b=c.createBuffer(1,len,c.sampleRate),x=b.getChannelData(0);
    for(let i=0;i<len;i++)x[i]=Math.random()*2-1;const src=c.createBufferSource();src.buffer=b;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;
    const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);src.connect(f);f.connect(g);g.connect(dest||this.master);src.start(t)},
  fx(n){
    if(!S.sfx||!this.init())return;const t=this.ctx.currentTime;
    if(n==='click')this.tone(720,t,.05,{type:'triangle',vol:.08});
    if(n==='draw')this.tone(420,t,.12,{type:'triangle',to:980,vol:.12});
    if(n==='punch'){this.noise(t+.32,.18,.55,900);this.tone(190,t+.32,.22,{type:'sine',to:45,vol:.55})}
    if(n==='win')[523,659,784,1047].forEach((f,i)=>this.tone(f,t+i*.08,.14,{vol:.1}));
    if(n==='turn')[[523,0,.12],[523,.13,.12],[523,.26,.12],[698,.4,.5],[880,.4,.5]].forEach(([f,o,d])=>this.tone(f,t+o,d,{vol:.09}));
    if(n==='lose')[392,370,349,311].forEach((f,i)=>this.tone(f,t+i*.24,i===3?.7:.22,{type:'sawtooth',vol:.09}));

      o.connect(bp);bp.connect(g);g.connect(this.master);o.start(t);l.start(t);o.stop(t+1.8);l.stop(t+1.8);

  },
  startMusic(){if(!S.music||!this.init()||this.timer)return;this.next=this.ctx.currentTime+.1;this.step=0;this.timer=setInterval(()=>this.sched(),60)},
  stopMusic(){clearInterval(this.timer);this.timer=null},
  sched(){const e=60/128/2;
    while(this.next<this.ctx.currentTime+.25){const i=this.step%32;
      if(BASS[i])this.tone(mf(BASS[i]),this.next,e*.9,{type:'triangle',vol:.28,dest:this.mus});
      if(MEL[i])this.tone(mf(MEL[i]),this.next,e*.75,{type:'square',vol:.06,dest:this.mus});

  selected=selected.filter(id=>chars.some(c=>c.id===id));
  const L=$('#playersList');
  if(!chars.length){L.innerHTML=`<div class="empty"><b>Aucun perso pour l'instant</b>Crée un perso pour chaque joueur avec « + Nouveau perso ». Ils restent enregistrés dans ce téléphone pour les prochaines soirées.</div>`}
  else L.innerHTML=`<div class="tiles">${chars.map(c=>{const n=selected.indexOf(c.id);return `<div class="tile-wrap">
    <button class="tile ${n>=0?'on':''}" data-pick="${c.id}"><span class="av">${avatarSVG(c.av,n>=0?'happy':'neutral')}</span><span class="nm">${esc(c.name)}</span>${n>=0?`<span class="badge">${n+1}</span>`:''}</button>
    <button class="tile-edit" data-edit="${c.id}" aria-label="Modifier ${esc(c.name)}">${pencil}</button></div>`}).join('')}</div>`;
  $('#btnStart').disabled=selected.length<2;
  $('#btnStart').textContent=selected.length<2?'Lancer (2 min.)':`Lancer (${selected.length})`;
}
$('#playersList').addEventListener('click',e=>{
  const p=e.target.closest('[data-pick]'),ed=e.target.closest('[data-edit]');
  if(ed){Snd.fx('click');openEditor(chars.find(c=>c.id===ed.dataset.edit),()=>show('players'));return}
  if(p){Snd.fx('click');const id=p.dataset.pick,i=selected.indexOf(id);if(i>=0)selected.splice(i,1);else if(selected.length<12)selected.push(id);renderPlayers()}
});
$('#btnNewChar').onclick=()=>{Snd.fx('click');openEditor(null,c=>{if(c&&!selected.includes(c.id))selected.push(c.id);show('players')})};
$('#btnStart').onclick=()=>{Snd.fx('turn');newGame(selected.map(id=>chars.find(c=>c.id===id)));show('game');renderGame()};

/* ---------- Éditeur ---------- */
let ED=null,edExpr=0,edDone=null;
function openEditor(c,done){
  ED=c?{id:c.id,name:c.name,av:{...c.av}}:{id:null,name:'',av:randomAv()};edDone=done;edExpr=0;
  $('#edTitle').textContent=c?'Modifier le perso':'Nouveau perso';$('#edName').value=ED.name;$('#edDelete').hidden=!c;
  renderEditor();show('editor');
}
function renderEditor(){
  $('#edPreview').innerHTML=avatarSVG(ED.av,EXPRS[edExpr]);
  const chipGroup=(title,key,list)=>`<div class="group"><h3>${title}</h3><div class="chips">${list.map(([k,l])=>`<button class="chip ${ED.av[key]===k?'on':''}" data-k="${key}" data-v="${k}"><span class="av">${avatarSVG({...ED.av,[key]:k})}</span><span>${l}</span></button>`).join('')}</div></div>`;
  const swGroup=(title,key,list)=>`<div class="group"><h3>${title}</h3><div class="chips">${list.map(([k,l])=>`<button class="sw ${ED.av[key]===k?'on':''}" style="background:${k}" data-k="${key}" data-v="${k}" aria-label="${l||k}"></button>`).join('')}</div></div>`;
  const sc=$('#edOptions').scrollTop;
  $('#edOptions').innerHTML=swGroup('Peau','skin',SKINS.map(s=>[s,'']))+chipGroup('Coupe','hair',HAIRS)+swGroup('Couleur des cheveux','hairColor',HAIRC)
    +chipGroup('Barbe','beard',BEARDS)+chipGroup('Moustache','mous',MOUS)+chipGroup('Lunettes','glasses',GLASSES)+chipGroup('Maillot','top',TOPS.map(t=>[t[0],t[1]]));
  $('#edOptions').scrollTop=sc;
}
$('#edOptions').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;Snd.fx('click');
  const row=b.parentElement,sl=row.scrollLeft,idx=[...$('#edOptions').querySelectorAll('.chips')].indexOf(row);
  ED.av[b.dataset.k]=b.dataset.v;renderEditor();const rows=$('#edOptions').querySelectorAll('.chips');if(rows[idx])rows[idx].scrollLeft=sl});
$('#edPreview').onclick=()=>{edExpr=(edExpr+1)%EXPRS.length;Snd.fx('click');$('#edPreview').innerHTML=avatarSVG(ED.av,EXPRS[edExpr])};
$('#edName').oninput=e=>{ED.name=e.target.value};
$('#edCancel').onclick=()=>{Snd.fx('click');edDone&&edDone(null)};
$('#edSave').onclick=()=>{
  const name=($('#edName').value||'').trim();if(!name){$('#edName').focus();$('#edName').placeholder='Ajoute un prénom';return}
  Snd.fx('win');let c;
  if(ED.id){c=chars.find(x=>x.id===ED.id);c.name=name;c.av={...ED.av}}else{c={id:uid(),name,av:{...ED.av}};chars.push(c)}
  store.set(K_CHARS,chars);
  if(G){G.players.forEach(p=>{if(p.cid===c.id){p.name=c.name;p.av={...c.av}}});saveGame()}
  edDone&&edDone(c);
};
$('#edDelete').onclick=()=>{
  openSheet(`<h2>Supprimer ${esc(ED.name)} ?</h2><p style="margin:0">Le perso sera effacé de ce téléphone.</p><div class="foot"><button class="btn paper" data-act="close">Garder</button><button class="btn red" data-act="delchar">Supprimer</button></div>`);
};

/* ---------- Partie ---------- */
let G=null,sel=null,busy=false;
function draw(){
  if(!G.deck.length){G.deck=shuffle(G.discard);G.discard=[];
    if(!G.deck.length)G.deck=buildDeck();}
  return G.deck.pop();
}
function buildDeck(){const d=[];ANIMALS.forEach((a,i)=>{for(let k=0;k<a[2];k++)d.push({id:uid(),a:i})});return shuffle(d)}
function newGame(list){
  G={players:list.map(c=>({cid:c.id,name:c.name,av:{...c.av},g:0,c:0,out:false})),cur:0,streak:0,rows:[],deck:buildDeck(),discard:[]};
  for(let r=0;r<4;r++)G.rows.push([draw()]);sel=null;saveGame();
}
const saveGame=()=>{if(G)store.set(K_GAME,G)};
const P=()=>G.players[G.cur];
const animalName=c=>ANIMALS[c.a][0];
function cardHTML(c,extra=''){
  const A=ANIMALS[c.a],art=ART[c.a]?`<span class="em art">${animalSVG(c.a)}</span>`:`<span class="em polo av">${avatarSVG(POLO,'angry')}</span>`;
  return `<div class="card ${extra}" data-id="${c.id}" style="--c:${CARD_COLORS[(c.a*5)%6]}">${art}<span class="nm">${A[0]}</span></div>`;
}
const arrowL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>';
const arrowR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6l6 6-6 6"/></svg>';
function renderHead(ex='neutral'){
  $('#curAv').innerHTML=avatarSVG(P().av,ex);$('#curName').textContent=P().name;
  $('#pips').innerHTML=[0,1,2].map(i=>`<span class="pip ${i<G.streak?'on':''}"></span>`).join('');
}
function renderBoard(opt={}){
  const b=$('#board'),prev=[...b.querySelectorAll('.track')].map(t=>t.scrollLeft);
  b.innerHTML=G.rows.map((row,r)=>`<div class="row" data-r="${r}">
    <span class="count">${row.length} carte${row.length>1?'s':''}</span>
    <button class="zone" data-r="${r}" data-side="L" aria-label="Ligne ${r+1}, à gauche">${arrowL}</button>
    <div class="track"><div class="track-in">${row.map(c=>cardHTML(c,opt.newId===c.id?'new':'')).join('')}</div></div>
    <button class="zone" data-r="${r}" data-side="R" aria-label="Ligne ${r+1}, à droite">${arrowR}</button></div>`).join('');
  b.querySelectorAll('.track').forEach((t,r)=>{
    if(opt.scroll&&opt.scroll.r===r)t.scrollLeft=opt.scroll.side==='L'?0:t.scrollWidth;else if(prev[r]!=null)t.scrollLeft=prev[r]});
  markSel();
}
function markSel(){
  document.querySelectorAll('.zone').forEach(z=>z.classList.toggle('on',!!sel&&+z.dataset.r===sel.r&&z.dataset.side===sel.side));
  const p=$('#prompt');
  if(sel){const row=G.rows[sel.r],ref=sel.side==='L'?row[0]:row[row.length-1];
    p.innerHTML=`Ligne ${sel.r+1}, ${sel.side==='L'?'à gauche':'à droite'} : la prochaine carte est-elle plus forte ou moins forte que <b>${esc(animalName(ref))}</b> ?`}
  else p.textContent='Choisis un côté d\'une ligne.';
  $('#btnPlus').disabled=$('#btnMoins').disabled=!sel||busy;
}
function renderGame(){renderHead();renderBoard()}
$('#board').addEventListener('click',e=>{
  const z=e.target.closest('.zone');if(!z||busy)return;Snd.fx('click');
  const r=+z.dataset.r,side=z.dataset.side;sel=(sel&&sel.r===r&&sel.side===side)?null:{r,side};
  const t=z.parentElement.querySelector('.track');if(sel)t.scrollTo({left:side==='L'?0:t.scrollWidth,behavior:'smooth'});
  markSel();
});
$('#btnPlus').onclick=()=>play('plus');
$('#btnMoins').onclick=()=>play('moins');

async function play(dir){
  if(!sel||busy)return;busy=true;markSel();
  const {r,side}=sel,row=G.rows[r],ref=side==='L'?row[0]:row[row.length-1],card=draw();
  if(side==='L')row.unshift(card);else row.push(card);
  Snd.fx('draw');renderBoard({newId:card.id,scroll:{r,side}});
  document.querySelectorAll('.zone').forEach(z=>z.classList.remove('on'));
  await sleep(520);
  if(card.a===ref.a){ // POTEAU
    Snd.fx('poteau');vibrate();renderHead('shocked');
    P().c++;saveGame();
    await overlay(`<div class="poteau-word">POTEAU<wbr>UUUUU</div><span class="av">${avatarSVG(P().av,'shocked')}</span><div class="msg">${esc(P().name)} : cul sec !</div><button class="btn" data-ok>C'est bu !</button>`,{cls:'poteau'});
    await clearRow(r);G.streak=0;
  }else{
    const strong=card.a>ref.a?card:ref,weak=strong===card?ref:card;
    const elS=document.querySelector(`[data-id="${strong.id}"]`),elW=document.querySelector(`[data-id="${weak.id}"]`);
    const toRight=row.indexOf(strong)<row.indexOf(weak);
    if(elS&&elW){elS.classList.remove('new');elS.classList.add(toRight?'punch-r':'punch-l');elW.classList.add(toRight?'hit-r':'hit-l');
      const boom=document.createElement('span');boom.className='boom';boom.textContent='PAF !';elW.appendChild(boom)}
    Snd.fx('punch');await sleep(760);
    const win=dir==='plus'?card.a>ref.a:card.a<ref.a;
    if(win){
      G.streak++;Snd.fx('win');renderHead('happy');saveGame();
      if(G.streak>=3){
        await overlay(`<span class="av">${avatarSVG(P().av,'happy')}</span><div class="big mint">3 d'affilée !</div><div class="msg">${esc(P().name)} passe la main.</div><button class="btn" data-ok>Suivant</button>`);
        nextPlayer();Snd.fx('turn');
        await overlay(`<span class="av">${avatarSVG(P().av,'neutral')}</span><div class="big">Au tour de</div><div class="msg" style="font-size:1.5rem;font-weight:800">${esc(P().name)}</div><button class="btn mint" data-ok>C'est parti</button>`);
      }else{
        await overlay(`<span class="av">${avatarSVG(P().av,'happy')}</span><div class="big mint">Gagné ! ${G.streak}/3</div>`,{auto:1100,cls:'toast'});
      }
    }else{
      const n=row.length;P().g+=n;saveGame();Snd.fx('lose');renderHead('sad');
      await overlay(`<span class="av">${avatarSVG(P().av,'sad')}</span><div class="big red">Raté !</div><div class="duel">${cardHTML(card)}<span>contre</span>${cardHTML(ref)}</div><div class="msg">${esc(P().name)} boit</div><div class="num">${n}</div><div class="msg">gorgée${n>1?'s':''}</div><button class="btn" data-ok>C'est bu !</button>`);
      await clearRow(r);G.streak=0;
    }
  }
  sel=null;busy=false;saveGame();renderHead();renderBoard();
}
async function clearRow(r){
  const el=document.querySelector(`.row[data-r="${r}"]`);if(el){el.classList.add('collapse');await sleep(450)}
  G.discard.push(...G.rows[r]);const c=draw();G.rows[r]=[c];Snd.fx('draw');renderBoard({newId:c.id});saveGame();await sleep(350);
}
function nextPlayer(){
  const n=G.players.length;for(let k=1;k<=n;k++){const i=(G.cur+k)%n;if(!G.players[i].out){G.cur=i;break}}
  G.streak=0;saveGame();
}

/* ---------- Calques ---------- */
function overlay(html,o={}){
  return new Promise(res=>{const el=$('#overlay');el.className='overlay '+(o.cls||'');el.innerHTML=`<div class="pop">${html}</div>`;el.hidden=false;
    const done=()=>{el.hidden=true;el.innerHTML='';el.className='overlay';res()};
    if(o.auto)setTimeout(done,o.auto);else el.querySelector('[data-ok]').addEventListener('click',()=>{Snd.fx('click');done()},{once:true});});
}
function openSheet(html){$('#sheet').innerHTML=html;$('#sheetBg').hidden=false}
function closeSheet(){$('#sheetBg').hidden=true;$('#sheet').innerHTML=''}
$('#sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')closeSheet()});

/* ---------- Menu de partie ---------- */
function renderMenu(){
  const tot=p=>p.g+10*p.c,active=G.players.filter(p=>!p.out).length;
  openSheet(`<h2>Menu</h2>
    <div class="toggles"><button class="toggle ${S.music?'on':''}" data-act="music">Musique<i></i></button><button class="toggle ${S.sfx?'on':''}" data-act="sfx">Bruitages<i></i></button></div>
    <h3>Joueurs</h3>
    <div class="plist">${G.players.map((p,i)=>`<div class="pl ${p.out?'out':''} ${i===G.cur?'cur':''}"><span class="av">${avatarSVG(p.av,p.out?'sad':'neutral')}</span>
      <div style="min-width:0"><b>${p.out?'<span class="tomb">🪦</span> ':''}${esc(p.name)}</b><small>${p.g} gorgée${p.g>1?'s':''} · ${p.c} cul${p.c>1?'s':''} sec${p.c>1?'s':''} · total ${tot(p)}</small></div>
      ${p.out?`<button class="btn small paper" data-act="back" data-i="${i}">Revenir</button>`:`<button class="btn small paper" data-act="out" data-i="${i}" ${active<=1?'disabled':''}>Retirer</button>`}</div>`).join('')}</div>
    <button class="btn paper small" data-act="add">+ Ajouter un joueur</button>
    <div class="stack" style="margin-top:6px"><button class="btn grape" data-act="pause">Pause (retour accueil)</button><button class="btn red" data-act="end">Terminer la partie</button></div>`);
}
function renderAddPicker(){
  const inGame=new Set(G.players.map(p=>p.cid)),free=chars.filter(c=>!inGame.has(c.id));
  openSheet(`<h2>Ajouter un joueur</h2>
    ${free.length?`<div class="plist">${free.map(c=>`<div class="pl"><span class="av">${avatarSVG(c.av)}</span><div style="min-width:0"><b>${esc(c.name)}</b><small>Jouera en dernier</small></div><button class="btn small mint" data-act="addchar" data-id="${c.id}">Ajouter</button></div>`).join('')}</div>`:'<p style="margin:0">Tous les persos enregistrés sont déjà dans la partie.</p>'}
    <button class="btn paper" data-act="newchar">+ Créer un perso</button><button class="btn paper small" data-act="menu">Retour au menu</button>`);
}
$('#btnMenu').onclick=()=>{if(busy)return;Snd.fx('click');renderMenu()};
$('#sheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;Snd.fx('click');
  if(a==='close')closeSheet();
  if(a==='music'){S.music=!S.music;saveSettings();S.music&&screen==='game'?Snd.startMusic():Snd.stopMusic();renderMenu()}
  if(a==='sfx'){S.sfx=!S.sfx;saveSettings();renderMenu()}
  if(a==='out'){const i=+b.dataset.i;G.players[i].out=true;if(i===G.cur){nextPlayer();sel=null;renderGame()}saveGame();renderMenu()}
  if(a==='back'){G.players[+b.dataset.i].out=false;saveGame();renderMenu()}
  if(a==='add')renderAddPicker();
  if(a==='menu')renderMenu();
  if(a==='addchar'){const c=chars.find(x=>x.id===b.dataset.id);G.players.push({cid:c.id,name:c.name,av:{...c.av},g:0,c:0,out:false});saveGame();renderMenu()}
  if(a==='newchar'){closeSheet();openEditor(null,c=>{if(c){G.players.push({cid:c.id,name:c.name,av:{...c.av},g:0,c:0,out:false});saveGame()}show('game');renderGame()})}
  if(a==='pause'){closeSheet();saveGame();show('home')}
  if(a==='end')openSheet(`<h2>Terminer la partie ?</h2><p style="margin:0">Le classement s'affiche et la partie est effacée. Les persos restent enregistrés.</p><div class="foot"><button class="btn paper" data-act="menu">Continuer</button><button class="btn red" data-act="endok">Terminer</button></div>`);
  if(a==='endok'){closeSheet();endGame()}
  if(a==='delchar'){chars=chars.filter(c=>c.id!==ED.id);store.set(K_CHARS,chars);closeSheet();selected=selected.filter(id=>id!==ED.id);show('players')}
});

/* ---------- Classement ---------- */
let lastLineup=[];
function endGame(){
  const tot=p=>p.g+10*p.c,list=[...G.players].sort((a,b)=>tot(b)-tot(a)||b.c-a.c);
  let pos=0;const html=list.map((p,i)=>{if(i===0||tot(p)!==tot(list[i-1])||p.c!==list[i-1].c)pos=i+1;
    const first=pos===1&&tot(p)>0;return `<div class="rk ${first?'first':''} ${p.out?'out':''}"><span class="pos">${pos}</span>
    <span class="av">${first?'<span class="crown">👑</span>':''}${avatarSVG(p.av,first?'happy':p.out?'sad':'neutral')}</span>
    <div style="min-width:0"><b>${p.out?'<span class="tomb">🪦</span> ':''}${esc(p.name)}</b><small>${p.g} gorgée${p.g>1?'s':''} · ${p.c} cul${p.c>1?'s':''} sec${p.c>1?'s':''}</small></div>
    <div class="tot">${tot(p)}<span>total</span></div></div>`}).join('');
  $('#ranks').innerHTML=html;lastLineup=G.players.filter(p=>!p.out).map(p=>p.cid).filter(id=>chars.some(c=>c.id===id));
  store.del(K_GAME);G=null;show('ranking');Snd.fx('turn');
}
$('#btnReplay').onclick=()=>{Snd.fx('click');selected=[...lastLineup];show('players')};

/* ---------- Démarrage ---------- */
document.addEventListener('touchend',()=>{if(Snd.ctx&&Snd.ctx.state==='suspended')Snd.ctx.resume()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveGame();Snd.stopMusic()}else if(screen==='game')Snd.startMusic()});
show('home');
try{if('serviceWorker' in navigator&&location.hostname.endsWith('github.io'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
